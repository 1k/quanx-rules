// ==UserScript==
// @ScriptName        微信去广告（公众号+朋友圈+小程序）
// @Author            自维护
// @Function          去除公众号文章内广告、朋友圈信息流广告、小程序开屏/横幅广告
// ==/UserScript==

hostname = mp.weixin.qq.com, *.weixin.qq.com, *.qq.com, mapi2.yun-gui.com

# 公众号文章顶部/底部广告
^https?:\/\/mp\.weixin\.qq\.com\/mp\/getappmsgad url reject-200

# 朋友圈信息流广告（需配合脚本）
^https?:\/\/.*\.weixin\.qq\.com\/cgi-bin\/micromsg-bin\/mmsnstimeline url script-response-body https://raw.githubusercontent.com/1k/quanx-rules/main/scripts/wechat-moments.js

# ===== 小程序广告 =====
# 小程序开屏广告
^https?:\/\/.*\.qq\.com\/.*\/splash.*ad url reject-200
# 小程序横幅/插屏广告（广点通）
^https?:\/\/gdt\.qq\.com\/.*ad.* url reject-200
^https?:\/\/.*\.gdt\.qq\.com url reject-200
# 小程序广告组件接口
^https?:\/\/mp\.weixin\.qq\.com\/wxa\/.*ad.* url reject-200

# 云柜快递服务小程序去广告（清空广告位数据）
^https?:\/\/mapi2\.yun-gui\.com\/ygmapi\/miniprogram\/ad\/slot\/list url script-response-body https://raw.githubusercontent.com/1k/quanx-rules/main/scripts/yungui-ads.js

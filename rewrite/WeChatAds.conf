// ==UserScript==
// @ScriptName        微信去广告（公众号+朋友圈）
// @Author            自维护
// @Function          去除公众号文章内广告、朋友圈信息流广告
// ==/UserScript==

hostname = mp.weixin.qq.com, *.weixin.qq.com

# 公众号文章顶部/底部广告
^https?:\/\/mp\.weixin\.qq\.com\/mp\/getappmsgad url reject-200

# 朋友圈信息流广告（需配合脚本）
^https?:\/\/.*\.weixin\.qq\.com\/cgi-bin\/micromsg-bin\/mmsnstimeline url script-response-body https://raw.githubusercontent.com/1k/quanx-rules/main/scripts/wechat-moments.js

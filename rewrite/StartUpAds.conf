// ==UserScript==
// @ScriptName        去开屏广告（通用）
// @Author            自维护
// @Function          拦截主流广告SDK的开屏广告请求
// ==/UserScript==

hostname = *.pangolin-sdk-toutiao.com, *.pangle.io, *.mobads.baidu.com, *.gdt.qq.com

# 穿山甲（今日头条系）开屏广告
^https?:\/\/.*\.pangolin-sdk-toutiao\.com.*\/splash url reject-200
^https?:\/\/.*\.pangle\.io.*\/splash url reject-200

# 百度移动广告开屏
^https?:\/\/.*\.mobads\.baidu\.com.*\/splash url reject-200

# 广点通开屏
^https?:\/\/.*\.gdt\.qq\.com.*\/splash url reject-200

# 通用：拦截常见开屏广告API路径
^https?:\/\/.*\/api\/.*splash.*ad url reject-200
^https?:\/\/.*\/ad\/.*splash url reject-200

^https?:\/\/api\.ys7\.com\/api\/ads\/v2\/.* url reject-200
^https?:\/\/api\.ys7\.com\/v3\/adService\/.* url reject-200
^https?:\/\/api\.ys7\.com\/v3\/ad\/data\/.* url reject-200
^https?:\/\/api\.ys7\.com\/v3\/integral\/record\/userAdOperation url reject-200
^https?:\/\/ecapi-flood\.ys7\.com\/v1\/ad\/.* url reject-200
# 第三方广告 SDK
^https?:\/\/.*\.1rtb\.net\/.* url reject-200
^https?:\/\/cdn\.1rtb\.com\/.* url reject-200
^https?:\/\/.*\.leadmoad\.com\/.* url reject-200
^https?:\/\/.*\.adbiding\.cn\/.* url reject-200

# 移动云盘：剪切板授权弹窗处理
# App 用 getStatus 查 clipboard 状态，未同意就每次启动弹窗。
# 只废这一问的返回值（回失败），不伪造同意、不授权读取。脚本见 scripts/yun139-clipboard-status.js
hostname = middle.yun.139.com

^https?:\/\/middle\.yun\.139\.com\/openapi\/general\/getStatus url script-response-body https://raw.githubusercontent.com/1k/quanx-rules/main/scripts/yun139-clipboard-status.js
